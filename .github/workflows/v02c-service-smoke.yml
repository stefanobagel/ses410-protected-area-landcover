name: v0.2c real-service smoke
on:
  push:
    branches: [v0.2c]
    paths:
      - '.github/workflows/v02c-service-smoke.yml'
      - 'branches/v0.2c/teacher.py'
      - 'branches/v0.2c/imagery.py'
      - 'branches/v0.2c/runtime.py'
      - 'branches/v0.2c/config.json'
      - 'branches/v0.2c/tools/linux_service_smoke.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v02c-public-service-smoke
  cancel-in-progress: false
jobs:
  teacher-public-services:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU runtime on hosted Linux
        run: |
          python -m pip install --quiet torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet 'numpy>=1.26,<3' requests 'rasterio>=1.4,<2' scikit-image
      - name: Load trained head and infer real TCI for both study areas
        run: python -u branches/v0.2c/tools/linux_service_smoke.py
      # Results are in logs and the job summary. No artifact/cache storage or
      # Google secret, OIDC trust, paid runner, GPU or cloud resource is provisioned.
